<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <meta name="color-scheme" content="dark light"/>
  <meta name="theme-color" content="#101111"/>
  <title>入群申请示例 · Agent Hub</title>
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/site.css"/>
  <style>
    .form-preview { max-width: 840px; margin: auto; padding: 40px 32px 96px; }
    .form-preview nav { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-right: 48px; margin-bottom: 88px; }
    .form-preview nav a { min-height: 48px; display: inline-flex; align-items: center; font-size: 14px; }
    .form-preview nav span { color: var(--color-muted); font-size: 13px; }
    .form-preview h1 { font: 400 clamp(2.5rem, 7vw, 4rem)/1.3 var(--font-display); max-width: none; }
    .form-intro { margin-top: 24px; color: var(--color-muted); font-size: 16px; line-height: 1.9; }
    .form-preview form { margin-top: 56px; }
    .form-field { display: grid; gap: 12px; margin-bottom: 32px; }
    .form-field label { font-size: 14px; }
    .form-field input, .form-field textarea { width: 100%; min-height: 56px; border: 0; border-bottom: 1px solid var(--color-rule); border-radius: 0; background: var(--color-paper-2); color: var(--color-ink); padding: 16px; outline-offset: 4px; }
    .form-field textarea { min-height: 144px; resize: vertical; }
    .form-field input::placeholder, .form-field textarea::placeholder { color: var(--color-muted); }
    .form-preview form button { padding: 16px 24px; min-height: 56px; background: var(--color-paper-3); border: 1px solid var(--color-rule); color: var(--color-muted); cursor: default; opacity: 1; }
    .form-status { font-size: 13px; color: var(--color-muted); margin-top: 20px; line-height: 1.8; }
    @media(max-width: 600px) { .form-preview { padding-inline: 24px; } .form-preview nav { margin-bottom: 56px; } }
  </style>
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="切换日间模式" aria-pressed="false"><svg class="theme-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><svg class="theme-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.9 13a9 9 0 0 1-9.9-9.9A9 9 0 1 0 20.9 13Z"/></svg></button>
  <main class="form-preview">
    <nav aria-label="返回主页"><a href="./#join">↖ 返回 Agent Hub</a><span>示例表单</span></nav>
    <h1>入群申请</h1>
    <p class="form-intro">这是入群申请表的样式预览，正式申请入口待更新。<br/>本页不会提交或保存你填写的内容。</p>
    <form aria-label="入群申请示例" aria-describedby="form-status" onsubmit="return false">
      <div class="form-field"><label for="applicant-name">如何称呼你</label><input id="applicant-name" type="text" placeholder="姓名或常用昵称" autocomplete="off"/></div>
      <div class="form-field"><label for="applicant-team">所在团队或学校</label><input id="applicant-team" type="text" placeholder="团队、学校或独立开发者" autocomplete="off"/></div>
      <div class="form-field"><label for="applicant-work">研究方向与参与意向</label><textarea id="applicant-work" placeholder="简单介绍你正在做的工作，以及希望在社群里交流的话题。"></textarea></div>
      <div class="form-field"><label for="applicant-link">论文、项目或个人主页（选填）</label><input id="applicant-link" type="url" placeholder="https://" autocomplete="off"/></div>
      <button type="button" disabled>示例预览，暂未开放提交</button>
      <p id="form-status" class="form-status">正式表单上线后，此入口将替换为实际申请链接。</p>
    </form>
  </main>
</body>
</html>
